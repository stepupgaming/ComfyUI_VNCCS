# VNCCS Studio runtime model paths. Weights are referenced in place, never copied.
# Files the Control Center downloads land in the runtime's own models/ folder.
# runtime/MODELS.md maps every file Studio loads to the folder that serves it.
# ComfyUI searches these entries in order, so the SSD folders come first.

# NVMe SSD: the QI2 weights every Studio run loads.
qwen_image_21:
    base_path: C:/Models/qwen-image-2.1/
    diffusion_models: diffusion_models/
    text_encoders: text_encoders/
    vae: vae/

# SATA SSD: the H3 diffusion model.
minimax_h3_comfy:
    base_path: F:/Models/MiniMax-H3-Comfy/
    diffusion_models: diffusion_models/

# Only the text encoder, VAEs and LoRAs: this folder's diffusion models are FL2VA, not Ref2VA.
minimax_h3_local:
    base_path: C:/Projects/minimax-h3/checkpoints/
    text_encoders: text_encoders/
    vae: vae/
    loras: loras/

# HDD archive: the rest of each download. Studio does not load these by default.
qwen_image_21_archive:
    base_path: G:/Models/qwen-image-2.1/
    text_encoders: text_encoders/

minimax_h3_comfy_archive:
    base_path: G:/Models/MiniMax-H3-Comfy/
    diffusion_models: diffusion_models/
